appId: com.fired.app
productName: Fired
copyright: Copyright © 2026 Ulrik Josephat Matemu

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - "!**/*.{ts,map}"
  - "!**/node_modules/**/{test,tests,__tests__}/**"

asarUnpack:
  - "**/*.node"

# --- macOS ---
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  # entitlements only needed once you sign — leave commented until you have a cert
  # entitlements: build/entitlements.mac.plist
  # entitlementsInherit: build/entitlements.mac.plist

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# --- Windows ---
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Fired

# --- Linux ---
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Development
  desktop:
    entry:
      Name: Fired
      Comment: Professional Firestore Desktop Client

# --- Auto-update / publish ---
publish:
  provider: github
  owner: <your-github-username>
  repo: fired
  releaseType: release
